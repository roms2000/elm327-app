name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Dépendances système Qt
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libxcb-cursor0 libdbus-1-3 libfontconfig1
      - name: Installation
        # ELM327-emulator (sources uniquement) se construit avec pkg_resources, absent de setuptools >= 81.
        run: |
          pip install "setuptools<81" wheel
          # Son setup.py télécharge le README sur GitHub : quelques tentatives en cas d'erreur réseau.
          for i in 1 2 3; do pip install --no-build-isolation ELM327-emulator && break; sleep 10; done
          pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff format --check .
          ruff check .
      - name: Tests (cœur et intégration)
        run: pytest -v --durations=10 tests/unit tests/integration
      - name: Tests (interface)
        # -s : les messages Qt restent visibles si le processus s'arrête brutalement.
        run: |
          pytest -v -s tests/ui/test_refcount.py || true
          pytest -v -s tests/ui
