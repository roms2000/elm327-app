[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "obdtool"
version = "0.1.0"
description = "Outil de diagnostic OBD-II pour adaptateurs ELM327 (Linux, Qt 6)"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
authors = [{ name = "roms2000" }]
dependencies = [
	"obd>=0.7.2",
	"pyserial>=3.5",
	# PySide6 6.12.0 dérègle le compteur de références de True à chaque Signal.emit sous Python 3.11
	# (plantage « bool_dealloc ») ; 6.8 à 6.11 ne sont pas touchés.
	"PySide6>=6.6,<6.12; python_version < '3.12'",
	"PySide6>=6.6; python_version >= '3.12'",
	"pyqtgraph>=0.13.7",
	"numpy>=1.26",
	"tomli-w>=1.0",
]

[project.optional-dependencies]
# ELM327-emulator est sous licence CC-BY-NC-SA : dépendance optionnelle.
demo = ["ELM327-emulator>=3.0"]
export = ["matplotlib>=3.8"]
dev = [
	"ELM327-emulator>=3.0",
	"matplotlib>=3.8",
	"pytest>=8",
	"pytest-qt>=4.4",
	"pytest-timeout>=2.3",
	"ruff>=0.6",
]

[project.scripts]
obdtool-cli = "obdtool.cli:main"

[project.gui-scripts]
obdtool = "obdtool.ui.app:main"

[tool.setuptools.packages.find]
include = ["obdtool*"]

[tool.setuptools.package-data]
"obdtool.core" = ["data/*.json"]
"obdtool.ui" = ["resources/*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.format]
indent-style = "tab"
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# W191 / E101 : incompatibles avec l'indentation par tabulations.
# RUF001-003 : caractères ambigus, normaux dans des chaînes en français.
ignore = ["W191", "E101", "E501", "RUF001", "RUF002", "RUF003", "RUF012"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
	"integration: tests contre ELM327-emulator",
	"hardware: tests nécessitant un adaptateur réel (désactivés par défaut)",
]
addopts = "-m 'not hardware'"
timeout = 120
qt_api = "pyside6"
